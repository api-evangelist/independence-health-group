description: >-
  Independence Health Group is the Philadelphia-headquartered parent holding
  company of Independence Blue Cross (the Blue Cross and Blue Shield licensee
  for southeastern Pennsylvania), AmeriHealth Administrators (a national
  third-party benefits administrator), and AmeriHealth New Jersey. Through its
  subsidiaries the group serves approximately seven million members and is one
  of the largest health insurers in the Philadelphia region. Independence
  Health Group itself does not publish a developer portal or APIs; all
  CMS Interoperability and Patient Access surfaces are operated by the
  subsidiary plans (notably Independence Blue Cross and AmeriHealth New Jersey).
